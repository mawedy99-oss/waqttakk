<meta name="claude:viewport-fit-sides" content="cover">
<title>Waqtk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: RTL single column on phones with a bottom tab bar; a sticky top bar and a centered 1180px frame on desktop. */
:root {
  --bg: #F5F7F8; --surface: #FFFFFF; --fg: #1A1A2E; --muted: #6B7280;
  --primary: #A8497A; --primary-dark: #7A3560; --soft: #F8EEF2; --line: #EDE3E8;
  --ok: #15803D; --warn: #B45309; --bad: #B91C1C; --shadow: 0 1px 2px rgba(26,26,46,.05), 0 6px 18px rgba(26,26,46,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #140C12; --surface: #211520; --fg: #F7EEF3; --muted: #B8A3B0;
    --primary: #D98AAA; --primary-dark: #F0B7CC; --soft: #34192A; --line: #3A2433; --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #140C12; --surface: #211520; --fg: #F7EEF3; --muted: #B8A3B0;
  --primary: #D98AAA; --primary-dark: #F0B7CC; --soft: #34192A; --line: #3A2433; --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: "Rubik", "Segoe UI", Tahoma, Arial, sans-serif; font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 20px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.sm { width: 16px; height: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.price { font-weight: 700; font-variant-numeric: tabular-nums; }
.price small { font-size: 11px; color: var(--muted); font-weight: 500; }
.old { text-decoration: line-through; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 1180px; margin: 0 auto; height: 60px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--primary); font-size: 17px; white-space: nowrap; }
.brand-mark { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #B9557F, #7A3560); color: #fff; display: grid; place-items: center; font-size: 15px; }
.nav-links { display: none; gap: 4px; margin-inline-start: 12px; }
.nav-links button { padding: 8px 12px; border-radius: 999px; color: var(--muted); font-weight: 500; display: flex; gap: 6px; align-items: center; }
.nav-links button[aria-current="page"] { color: var(--primary); background: var(--soft); font-weight: 700; }
.top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { position: relative; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.dot { position: absolute; top: -4px; inset-inline-end: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.dot:empty { display: none; }
.main { max-width: 1180px; margin: 0 auto; padding-block: 16px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.tabbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--muted); min-width: 0; flex: 1; font-weight: 500; }
.tabbar button[aria-current="page"] { color: var(--primary); font-weight: 700; }
.tabbar .i { width: 22px; height: 22px; }
.toast {
  position: fixed; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 30; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 760px) {
  .nav-links { display: flex; }
  .tabbar { display: none; }
  .main { padding-bottom: 40px; }
}

/* ---------- Primitives ---------- */
.section { margin-top: 28px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.link { color: var(--primary); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 14px; font-weight: 700; background: linear-gradient(135deg, #B9557F, var(--primary-dark)); color: #fff; box-shadow: 0 6px 16px rgba(197,17,98,.22); white-space: nowrap; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 12px; }
.btn.ghost { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); box-shadow: none; }
.btn.block { width: 100%; }
.btn.danger { background: var(--bad); box-shadow: none; }
.btn:disabled { opacity: .6; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"], .chip.on { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
.row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.row > * { flex: none; scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 620px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 940px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.badge { position: absolute; top: 10px; inset-inline-start: 10px; background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
.tag { display: inline-flex; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--primary); }
.status { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.status.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.status.wait { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.status.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.status.mute { background: var(--line); color: var(--muted); }

/* placeholder image blocks (no photos available) */
.ph { position: relative; aspect-ratio: 4 / 3; border-radius: 14px 14px 0 0; overflow: hidden; display: grid; place-items: center;
  background: radial-gradient(120% 90% at 20% 10%, hsl(var(--h) 40% 96%), hsl(var(--h) 28% 88%)); color: hsl(var(--h) 30% 38%); }
.ph .i { width: 38px; height: 38px; opacity: .8; }
.ph.sq { aspect-ratio: 1 / 1; }
.ph.rounded { border-radius: 14px; }
.fav { position: absolute; top: 10px; inset-inline-end: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); box-shadow: var(--shadow); }
.fav.on { color: var(--primary); }
.fav.on .i { fill: currentColor; }

/* item cards */
.item { overflow: hidden; display: flex; flex-direction: column; }
.item .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.item .cat { font-size: 12px; color: var(--primary); font-weight: 600; }
.item .meta { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.item .meta .i { width: 14px; height: 14px; color: #C0605F; fill: #C0605F; stroke: #C0605F; }
.item .row-between { margin-top: auto; padding-top: 6px; }
.row .card.item.w { width: 200px; }
.row .card.item.w.wide { width: 230px; }
.grid > * { min-width: 0; }
.grid .card.item { height: 100%; }

/* hero & banners */
.hero { position: relative; border-radius: 22px; overflow: hidden; min-height: 210px; color: #fff; }
.slide { position: absolute; inset: 0; padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 8px; opacity: 0; transition: opacity .6s; background: linear-gradient(120deg, #B9557F 0%, #7A3560 100%); }
.slide.on { opacity: 1; }
.slide.s2 { background: linear-gradient(120deg, #F06292 0%, #AD1457 100%); }
.slide.s3 { background: linear-gradient(120deg, #C2185B 0%, #6A1B4D 100%); }
.slide h2 { font-size: 24px; max-width: 16ch; }
.slide p { margin: 0; opacity: .9; max-width: 36ch; font-size: 14px; }
.slide .btn { background: #fff; color: var(--primary-dark); box-shadow: none; align-self: flex-start; margin-top: 4px; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.dots button { width: 7px; height: 7px; border-radius: 999px; background: var(--line); }
.dots button[aria-current="true"] { width: 22px; background: var(--primary); }
.hero-meta { position: absolute; inset-inline-start: 0; bottom: 0; }
@media (min-width: 760px) { .slide { padding: 40px; } .slide h2 { font-size: 34px; } .hero { min-height: 280px; } }

/* header greeting */
.greet { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--soft), var(--line)); display: grid; place-items: center; color: var(--primary); font-weight: 800; flex: none; }
.greet .loc { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; margin-top: 2px; }
.greet .loc .i { width: 16px; height: 16px; }

/* quick actions */
.quick { display: grid; grid-template-columns: repeat(5, 1fr); padding: 10px 6px; }
.quick button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; position: relative; padding: 6px 2px; min-width: 0; }
.quick button + button { border-inline-start: 1px solid var(--line); }
.quick .new { position: absolute; top: -2px; inset-inline-end: 6px; background: var(--primary); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; }
.quick .i { color: var(--primary); }

/* promo tiles */
.promos { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 620px) { .promos { grid-template-columns: repeat(3, 1fr); } }
.promo { border-radius: 18px; padding: 16px; min-height: 130px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; color: var(--fg); text-align: start; border: 1px solid var(--line); }
.promo h3 { font-size: 16px; font-weight: 700; }
.promo p { margin: 0; font-size: 13px; color: var(--muted); }
.promo .btn { min-height: 34px; font-size: 12px; align-self: flex-start; padding: 0 12px; border-radius: 10px; }
.p1 { background: linear-gradient(135deg, #FDE7EF, #F8BBD0); }
.p2 { background: linear-gradient(135deg, #FFF3E0, #FFE0B2); }
.p3 { background: linear-gradient(135deg, #FCE4EC, #F48FB1); }
:root[data-theme="dark"] .p1 { background: #34192A; } :root[data-theme="dark"] .p2 { background: #3A2A1E; } :root[data-theme="dark"] .p3 { background: #3A1E2C; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .p1 { background: #34192A; } :root:not([data-theme="light"]) .p2 { background: #3A2A1E; } :root:not([data-theme="light"]) .p3 { background: #3A1E2C; } }

/* categories */
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (min-width: 620px) { .cats { grid-template-columns: repeat(4, 1fr); } }
.cat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.cat-tile .ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; }

/* trust strip */
.trust { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 760px) { .trust { grid-template-columns: repeat(4, 1fr); } }
.trust div { display: flex; gap: 10px; align-items: center; padding: 12px; font-size: 13px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.trust .i { color: var(--primary); }

/* salon cards */
.salon { width: 220px; overflow: hidden; display: flex; flex-direction: column; }
.salon .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.salon .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.salon .tags span { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: var(--line); color: var(--muted); }
.featured { position: absolute; top: 10px; inset-inline-start: 10px; background: #F5B301; color: #3B2A00; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
.dist { font-size: 12px; color: var(--muted); }

/* lists */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 14px; width: 100%; text-align: start; border-bottom: 1px solid var(--line); min-width: 0; }
.list-row:last-child { border-bottom: 0; }
.list-row .ico { width: 38px; height: 38px; border-radius: 12px; background: var(--soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.list-row .txt { flex: 1; min-width: 0; }
.list-row .chev { color: var(--muted); }
.list-row.danger { color: var(--bad); }
.list-row.danger .ico { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }

/* segmented tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { padding: 12px 14px; color: var(--muted); font-weight: 500; position: relative; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--primary); font-weight: 700; }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; inset-inline: 8px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); }
.count { font-size: 11px; background: var(--primary); color: #fff; border-radius: 999px; padding: 1px 6px; font-weight: 700; }

/* page header */
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.page-h .back { display: flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 600; }

/* bookings */
.bk { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.bk-top { display: flex; gap: 12px; align-items: flex-start; }
.bk-top .ph { width: 76px; height: 76px; aspect-ratio: auto; border-radius: 14px; flex: none; }
.bk-top .ph .i { width: 24px; height: 24px; }
.bk-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ref { font-size: 11px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; align-self: flex-start; font-variant-numeric: tabular-nums; }
.bk-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.bk-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bk-actions .wide { grid-column: 1 / -1; }
.note { padding: 12px 14px; border-radius: 14px; background: var(--soft); color: var(--fg); font-size: 13px; display: flex; gap: 10px; align-items: center; }
.note .i { color: var(--primary); }

/* product detail row */
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.qty button { width: 34px; height: 34px; font-size: 18px; color: var(--primary); }
.qty span { min-width: 30px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }

/* forms */
.form { padding: 16px; display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 680px) { .form { grid-template-columns: 1fr 1fr; } .form .full { grid-column: 1 / -1; } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field select {
  height: 48px; border-radius: 12px; border: 1px solid #F48FB1; background: var(--surface); padding: 0 14px; width: 100%; min-width: 0;
}
:root[data-theme="dark"] .field input, :root[data-theme="dark"] .field select { border-color: #6B2D4D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .field input, :root:not([data-theme="light"]) .field select { border-color: #6B2D4D; } }
.field input::placeholder { color: var(--muted); opacity: .7; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border-bottom: 1px solid var(--line); }
.switch-row:last-child { border-bottom: 0; }
.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(-18px); }
:root[dir="rtl"] .switch[aria-checked="true"]::after { transform: translateX(-18px); }

/* payment */
.pay-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: start; }
.pay-card:last-child { border-bottom: 0; }
.pay-card .brand-chip { width: 52px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #1F2937, #374151); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; letter-spacing: .5px; flex: none; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.radio.on { border-color: var(--primary); }
.radio.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.secure { display: flex; gap: 10px; align-items: center; padding: 14px; border: 1px dashed var(--primary); border-radius: 14px; font-size: 13px; color: var(--fg); }

/* points & coupons */
.points-hero { padding: 18px; background: linear-gradient(135deg, #B9557F, #7A3560); color: #fff; border: 0; }
.points-hero .big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stats3 div { background: rgba(255,255,255,.14); border-radius: 12px; padding: 10px; text-align: center; font-size: 12px; }
.stats3 b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.coupon { display: grid; grid-template-columns: 1fr 96px; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.coupon .c-main { padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.coupon .c-val { background: var(--primary); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; }
.coupon .c-val small { font-size: 11px; font-weight: 600; }
.coupon.gold .c-val { background: #E08A00; } .coupon.gray .c-val { background: #9CA3AF; }
.coupon.gray { opacity: .75; }

/* stats tiles */
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.tiles button, .tiles div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }

    }
    if (d.go) { go(d.go); return; }
    if (d.dot !== undefined) { setSlide(+d.dot); return; }
    if (d.fav) {
      const id = d.fav;
      S.fav.has(id) ? S.fav.delete(id) : S.fav.add(id);
      toast(S.fav.has(id) ? 'تمت الإضافة إلى المفضلة' : 'تمت الإزالة من المفضلة');
      render(true); return;
    }
    if (d.add) { S.cart[d.add] = (S.cart[d.add] || 0) + 1; toast('أُضيف إلى السلة'); render(true); return; }
    if (d.qty) {
      const q = (S.cart[d.qty] || 0) + +d.d;
      if (q <= 0) delete S.cart[d.qty]; else S.cart[d.qty] = q;
      render(true); return;
    }
    if (d.interest) { S.interest = d.interest; render(true); return; }
    if (d.storecat) { S.storeCat = d.storecat; render(true); return; }
    if (d.favtab) { S.favTab = d.favtab; render(true); return; }
    if (d.booktab) { S.bookTab = d.booktab; S.confirmCancel = null; render(true); return; }
    if (d.cancelAsk) { S.confirmCancel = d.cancelAsk; render(true); return; }
    if (d.cancel) {
      const b = S.bookings.find(x => x.id === d.cancel);
      if (b) { b.state = 'cancelled'; b.status = 'bad'; b.label = 'ملغى'; }
      S.confirmCancel = null; toast('تم إلغاء الحجز'); render(true); return;
    }
    if (d.confirmNo !== undefined) { S.confirmCancel = null; render(true); return; }
    if (d.sfilter) { S.sfilter = d.sfilter; render(true); return; }
    if (d.pay) { S.pay = d.pay; render(true); return; }
    if (d.coup) { S.coupTab = d.coup; render(true); return; }
    if (d.notif) { S.notifTab = d.notif; render(true); return; }
    if (d.pref) { S.prefs[d.pref] = !S.prefs[d.pref]; render(true); return; }
    if (d.act) {
      switch (d.act) {
        case 'auth': go('login'); break;
        case 'login': S.user = true; toast('أهلاً بكِ'); go('home'); break;
        case 'logout': S.user = false; toast('تم تسجيل الخروج'); go('home'); break;
        case 'save': toast('تم حفظ التغييرات'); break;
        case 'toast': toast(d.msg); break;
        case 'readall': S.notifs.forEach(n => n.unread = false); toast('تم تعليم الكل كمقروء'); render(true); break;
        case 'checkout': go('checkout'); break;
      }
      return;
    }
  });

  document.addEventListener('input', e => {
    if (e.target.id === 'q') {
      S.q = e.target.value;
      const box = document.getElementById('results');
      if (box) box.innerHTML = resultsHTML();
    }
  });

  document.addEventListener('submit', e => {
    if (e.target.id === 'loginForm') { e.preventDefault(); S.user = true; toast('أهلاً بكِ'); go('home'); }
    if (e.target.id === 'acct') e.preventDefault();
  });

  document.addEventListener('change', e => {
    if (e.target.id === 'storeSearch') return;
  });

  // Store search: lightweight filter on product names
  document.addEventListener('input', e => {
    if (e.target.id !== 'storeSearch') return;
    const q = e.target.value.trim();
    document.querySelectorAll('.grid .card.item h3').forEach(h => {
      const card = h.closest('.card');
      card.style.display = !q || h.textContent.includes(q) ? '' : 'none';
    });
  });

  // ---------- Helpers for the new screens ----------
  const nowAt = () => new Date().toLocaleTimeString('ar', { hour: 'numeric', minute: '2-digit' });
  const pickDate = v => {
    if (!v) return null;
    const d = new Date(v + 'T00:00:00');
    return isNaN(d) ? null : dayLabelOf(d);
  };
  const phoneOk = p => (p || '').replace(/\D/g, '').length >= 10;

  function bookNext() {
    ensure();
    const b = S.bk;
    if (b.step === 2 && !b.time) { toast('اختاري الوقت أولاً'); return; }
    if (b.step === 3 && !phoneOk(b.phone)) { toast('أدخلي رقم هاتف صحيح'); return; }
    if (b.step < 4) { b.step++; render(false); return; }
    if (!b.terms) { toast('يرجى الموافقة على الشروط'); return; }
    const svc = SERVICES.find(x => x.id === b.svc) || SERVICES[0];
    const staff = b.staff === 'any' ? 'أي موظفة متاحة' : ((STAFF.find(s => s.id === b.staff) || {}).name || '—');
    const addr = S.addrs.find(a => a.id === b.addr) || S.addrs[0];
    const id = 'BZ-' + (1300 + S.bookings.length + 1);
    S.bookings.unshift({
      id, svc: svc.name, center: svc.center, date: b.dayLabel || days()[0].label, time: b.time,
      dur: svc.dur, price: svc.price, state: 'upcoming', status: 'wait', label: 'بانتظار التأكيد',
      hue: svc.hue, staff, addr: addr ? addr.line : '', note: b.note, pay: b.pay
    });
    S.lastBk = id; S.bk = null;
    toast('تم إرسال طلب الحجز');
    go('bookdone');
  }

  function placeOrder() {
    ensure();
    if (!S.ck.terms) { toast('يرجى الموافقة على الشروط'); return; }
    const lines = Object.entries(S.cart).map(([id, q]) => ({ p: PRODUCTS.find(x => x.id === id), q })).filter(x => x.p);
    if (!lines.length) { go('store'); return; }
    const sub = lines.reduce((a, l) => a + l.p.price * l.q, 0);
    const ship = S.ck.del === 'exp' ? 5000 : 2000;
    const disc = discountFor(sub);
    const addr = S.addrs.find(a => a.id === S.ck.addr) || S.addrs[0];
    const id = '#' + (1257 + S.orders.length);
    S.orders.unshift({
      id, date: dayLabelOf(new Date()), items: lines.map(l => `${l.p.name} × ${l.q}`),
      total: sub + ship - disc, state: 'قيد التجهيز', st: 'wait', hue: lines[0].p.hue, addr: addr ? addr.line : ''
    });
    if (S.ck.code) (S.usedCodes = S.usedCodes || []).push(S.ck.code);
    S.lastOrder = id; S.cart = {}; S.ck = { addr: S.ck.addr, del: 'std', pay: 'cash', coupon: '', disc: 0, note: '', terms: false };
    toast('تم استلام الطلب');
    go('ordersuccess');
  }

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.bkin !== undefined) { ensure(); S.bk[t.dataset.bkin] = t.value; return; }
    if (t.dataset.adin !== undefined) { ensure(); S.addDraft[t.dataset.adin] = t.value; return; }
    if (t.dataset.ckin !== undefined) { ensure(); S.ck[t.dataset.ckin] = t.value; return; }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    ensure();
    if (t.dataset.bkdate !== undefined) {
      const lbl = pickDate(t.value);
      if (lbl) { S.bk.day = -1; S.bk.dayLabel = lbl; S.bk.isoDate = t.value; S.bk.time = null; render(true); }
      return;
    }
    if (t.dataset.rsdate !== undefined) {
      const lbl = pickDate(t.value);
      if (lbl) { S.rs.day = -1; S.rs.dayLabel = lbl; S.rs.isoDate = t.value; S.rs.time = null; render(true); }
      return;
    }
    if (t.dataset.bkterms !== undefined) { S.bk.terms = t.checked; return; }
    if (t.dataset.ckterms !== undefined) { S.ck.terms = t.checked; return; }
  });

  render(false);
  setSlide(0);
})();
</script>
